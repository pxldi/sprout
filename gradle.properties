# Portable project settings only.
# Machine-specific values (SDK path, JDK path) belong in local.properties / JAVA_HOME.

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# KSP 2.2.10-2.0.2 (the version AGP 9.3.1 pins) still registers its generated sources through
# the kotlin.sourceSets DSL, which built-in Kotlin rejects by default. This is Google's
# documented escape hatch. Revisit when AGP ships a built-in-Kotlin-aware KSP.
android.disallowKotlinSourceSets=false
