name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'fastlane/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'fastlane/**']
  schedule:
    - cron: '0 4 * * 1'   # Monday, for the reproducibility check only
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (scoring and scheduling are the ones that matter)
        run: ./gradlew test

      - name: Static analysis
        run: ./gradlew detekt

      - name: Assemble FOSS debug
        run: ./gradlew :app:assembleFossDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'

  reproducible:
    # Builds twice and diffs, so R8/AGP updates that break reproducibility are caught
    # before F-Droid catches them. See docs/03-roadmap.md, Risks.
    #
    # Two clean R8 release builds are the most expensive thing in this file, and the thing
    # it guards against (a toolchain update) does not change between two commits on the same
    # day. So: tags, the weekly cron, and on demand — not every push.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: First build
        run: |
          ./gradlew :app:assembleFossRelease
          cp app/build/outputs/apk/foss/release/*.apk /tmp/first.apk

      - name: Second build from clean
        run: |
          ./gradlew clean
          ./gradlew :app:assembleFossRelease
          cp app/build/outputs/apk/foss/release/*.apk /tmp/second.apk

      - name: Diff
        run: |
          if cmp -s /tmp/first.apk /tmp/second.apk; then
            echo "Reproducible."
          else
            echo "::error::Two builds of the same source produced different APKs."
            sha256sum /tmp/first.apk /tmp/second.apk
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleFossRelease
      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/foss/release/*.apk
