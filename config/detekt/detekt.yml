# Overrides on top of detekt's defaults (buildUponDefaultConfig = true).
# Kept deliberately small: if a rule fires, the first question is whether the code is wrong.

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    # Colour literals and other named constants declared as properties are self-documenting.
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable']

complexity:
  LongParameterList:
    # A parameter with a default costs the caller nothing — `log(id, date, DONE)` is a
    # three-argument call whatever the signature says. Count only what callers must supply.
    ignoreDefaultParameters: true
